# The marketbots stack on the trading server: both engines, one shared scraper and the local LLM.
# The dashboards run on Vercel; MongoDB is hosted on Atlas, so there is no database here.
#
#   docker compose up -d --build                         build and start (restarts after reboots)
#   docker compose up -d --build stock-engine            redeploy one engine; the other is untouched
#   docker compose logs -f crypto-engine                 follow one engine's structured logs
#   docker compose --profile llm up -d llm               start the local LLM
#
# The two engines share nothing at runtime: separate images, containers, ports, env files,
# databases and leases. See docs/SERVER.md.

name: marketbots

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  crypto-engine:
    <<: *hardened
    build:
      context: .
      dockerfile: apps/crypto-engine/Dockerfile
    image: marketbots-crypto-engine:latest
    container_name: marketbots-crypto-engine
    env_file: crypto.env
    environment:
      STREAM_HOST: 0.0.0.0
      STREAM_PORT: 8787
      SCRAPER_URL: http://scraper:8790
      LLM_URL: http://llm:11434
    ports:
      # Loopback only: Caddy on the host forwards wss://engine.cryptomarketbot.app here.
      - "127.0.0.1:8787:8787"
    volumes:
      # The Kraken CLI paper wallet (balances + trade journal). Losing it means a paper reset.
      - kraken-paper:/data/kraken
      # Optional: Kraken OHLCVT CSV files for longer backtests (set BACKTEST_DATA_DIR=/data/ohlc).
      # - ./data/ohlc:/data/ohlc:ro
    stop_grace_period: 30s
    mem_limit: 1g
    logging: *logging

  stock-engine:
    <<: *hardened
    build:
      context: .
      dockerfile: apps/stock-engine/Dockerfile
    image: marketbots-stock-engine:latest
    container_name: marketbots-stock-engine
    env_file: stock.env
    environment:
      STREAM_HOST: 0.0.0.0
      STREAM_PORT: 8788
      SCRAPER_URL: http://scraper:8790
      LLM_URL: http://llm:11434
    ports:
      # Loopback only: Caddy on the host forwards wss://engine.stockmarketbot.app here.
      - "127.0.0.1:8788:8788"
    stop_grace_period: 30s
    # Up from 768 MB: headroom at the open with ~1,500 tracked symbols.
    mem_limit: 1g
    logging: *logging

  # Headless Chromium for news sources that need JavaScript, shared by both engines. No ports:
  # only the engines reach it. If it dies, only the headless sources go down.
  scraper:
    <<: *hardened
    build:
      context: .
      dockerfile: apps/scraper/Dockerfile
    image: marketbots-scraper:latest
    container_name: marketbots-scraper
    init: true
    mem_limit: 1g
    logging:
      <<: *logging
      options:
        max-size: "10m"
        max-file: "3"

  # Nightly copy of the paper wallet to backups/kraken/ on the host disk,
  # which survives a Docker or WSL reset. One at start, then daily at 10:00 UTC; the newest 14 kept.
  # Restore: docs/SERVER.md.
  wallet-backup:
    image: node:22-bookworm-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d
    container_name: marketbots-wallet-backup
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/kraken-paper-$$(date -u +%Y%m%dT%H%M%SZ).tgz
          tar -czf "$$f.part" -C /data . && mv "$$f.part" "$$f" && echo "backed up $$f ($$(du -h "$$f" | cut -f1))"
          ls -1t /backups/kraken-paper-*.tgz | tail -n +15 | xargs -r rm -f
          sleep $$(( $$(date -u -d 'tomorrow 10:00' +%s) - $$(date -u +%s) ))
        done
    volumes:
      - kraken-paper:/data:ro
      - ./backups/kraken:/backups
    mem_limit: 64m
    logging: *logging

  # Local article summaries. Off unless started with --profile llm.
  # GPU only: ~3 GB of VRAM while a model is loaded, released after 5 idle minutes.
  llm:
    image: ollama/ollama:0.40.11@sha256:dea72d1e22270fe095b68fdf756d2b489d615643c5a2eaebbc5f569181e322d8
    container_name: marketbots-llm
    profiles: [llm]
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_FLASH_ATTENTION: 1
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_MAX_QUEUE: 64
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    mem_limit: 2g
    cpus: 2
    logging: *logging

volumes:
  # THE paper wallet, created by the old cryptomarketbot compose project. `external` stops compose
  # from creating an empty marketbots_kraken-paper, which the engine would see as a wallet reset.
  kraken-paper:
    external: true
    name: cryptomarketbot_kraken-paper
  ollama-models:
