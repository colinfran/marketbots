# The marketbots stack on the trading server: both engines, one shared scraper, the local model
# server and the history store. The dashboards run on Vercel; their MongoDB is hosted on Atlas.
#
#   docker compose up -d --build                         build and start (restarts after reboots)
#   docker compose up -d --build stock-engine            redeploy one engine; the other is untouched
#   docker compose logs -f crypto-engine                 follow one engine's structured logs
#   docker compose up -d llm                             (re)start the local model server
#
# The two engines share nothing at runtime: separate images, containers, ports, env files,
# databases (one history database each, too) and leases. See docs/SERVER.md.

name: marketbots

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  crypto-engine:
    <<: *hardened
    build:
      context: .
      dockerfile: apps/crypto-engine/Dockerfile
    image: marketbots-crypto-engine:latest
    container_name: marketbots-crypto-engine
    env_file: .env.crypto
    environment:
      STREAM_HOST: 0.0.0.0
      STREAM_PORT: 8787
      SCRAPER_URL: http://scraper:8790
      LLM_URL: http://llm:8080
      LOG_DIR: /logs
      KRAKEN_OHLCVT_DIR: /data/ohlcvt
    ports:
      # Loopback only: Caddy on the host forwards wss://engine.cryptomarketbot.app here.
      - "127.0.0.1:8787:8787"
    networks: [default, ai]
    volumes:
      # The Kraken CLI paper wallet (balances + trade journal). Losing it means a paper reset.
      - kraken-paper:/data/kraken
      # The log history, one file per UTC day, on the host disk: a deploy replaces Docker's log,
      # not this. docs/SERVER.md §5.2.
      - ./logs/crypto-engine:/logs
      # Kraken's OHLCVT history for the history backfill (docs/SERVER.md §6.5); read-only. An empty
      # or missing folder just means nothing to import.
      - ./data/kraken-ohlcvt/csv:/data/ohlcvt:ro
      # Optional: Kraken OHLCVT CSV files for longer backtests (set BACKTEST_DATA_DIR=/data/ohlc).
      # - ./data/ohlc:/data/ohlc:ro
    stop_grace_period: 30s
    mem_limit: 1g
    logging: *logging

  stock-engine:
    <<: *hardened
    build:
      context: .
      dockerfile: apps/stock-engine/Dockerfile
    image: marketbots-stock-engine:latest
    container_name: marketbots-stock-engine
    env_file: .env.stock
    environment:
      STREAM_HOST: 0.0.0.0
      STREAM_PORT: 8788
      SCRAPER_URL: http://scraper:8790
      LLM_URL: http://llm:8080
      LOG_DIR: /logs
    ports:
      # Loopback only: Caddy on the host forwards wss://engine.stockmarketbot.app here.
      - "127.0.0.1:8788:8788"
    networks: [default, ai]
    volumes:
      # The log history (see crypto-engine).
      - ./logs/stock-engine:/logs
    stop_grace_period: 30s
    # Up from 768 MB: headroom at the open with ~1,500 tracked symbols.
    mem_limit: 1g
    logging: *logging

  # Headless Chromium for news sources that need JavaScript, shared by both engines. No ports:
  # only the engines reach it. If it dies, only the headless sources go down.
  scraper:
    <<: *hardened
    build:
      context: .
      dockerfile: apps/scraper/Dockerfile
    image: marketbots-scraper:latest
    container_name: marketbots-scraper
    init: true
    mem_limit: 1g
    logging:
      <<: *logging
      options:
        max-size: "10m"
        max-file: "3"

  # Nightly copy of the paper wallet to backups/kraken/ on the host disk,
  # which survives a Docker or WSL reset. One at start, then daily at 10:00 UTC; the newest 14 kept.
  # Restore: docs/SERVER.md.
  wallet-backup:
    image: node:22-bookworm-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d
    container_name: marketbots-wallet-backup
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/kraken-paper-$$(date -u +%Y%m%dT%H%M%SZ).tgz
          tar -czf "$$f.part" -C /data . && mv "$$f.part" "$$f" && echo "backed up $$f ($$(du -h "$$f" | cut -f1))"
          ls -1t /backups/kraken-paper-*.tgz | tail -n +15 | xargs -r rm -f
          sleep $$(( $$(date -u -d 'tomorrow 10:00' +%s) - $$(date -u +%s) ))
        done
    volumes:
      - kraken-paper:/data:ro
      - ./backups/kraken:/backups
    mem_limit: 64m
    logging: *logging

  # The history store (docs/plans/LOCAL-AI.md §6): Postgres with TimescaleDB and pgvector, one
  # database and role per bot (crypto_history, stock_history; created on the first start by
  # packages/history/docker/initdb.sh), the tables from the engines' migrations. No host port and
  # no internet: only the engines reach it, over the `ai` network. Its data lives in the
  # history-data volume, inside Docker's disk on C:. If it's down, only history stops.
  history:
    image: timescale/timescaledb:2.31.0-pg17@sha256:b56a3f51991df1f79d0c1a0841cad5c5fa8058fdd6a3ee6886394a6d4c174538
    container_name: marketbots-history
    restart: unless-stopped
    env_file: .env.history
    environment:
      HISTORY_DATABASES: crypto_history stock_history
      # timescaledb-tune sizes shared_buffers and workers for this, not for the whole VM.
      TS_TUNE_MEMORY: 2GB
      TS_TUNE_NUM_CPUS: 2
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - history-data:/var/lib/postgresql/data
      - ./packages/history/docker/initdb.sh:/docker-entrypoint-initdb.d/10-history.sh:ro
    networks: [ai]
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 2g
    logging: *logging

  # Nightly copy of the news archive (the one part of the history store nothing can fetch again)
  # to backups/history/ on the host disk, which survives a Docker or WSL reset. Once at start, then
  # daily at 10:30 UTC; the newest 7 per database kept. Bars aren't backed up: the backfills
  # rebuild them. Restore: docs/SERVER.md §6.4.
  history-backup:
    image: timescale/timescaledb:2.31.0-pg17@sha256:b56a3f51991df1f79d0c1a0841cad5c5fa8058fdd6a3ee6886394a6d4c174538
    container_name: marketbots-history-backup
    restart: unless-stopped
    user: "70:70"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: .env.history
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -o pipefail
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        until pg_isready -q -h history -U postgres; do sleep 10; done
        while true; do
          for db in crypto_history stock_history; do
            f=/backups/$$db-$$(date -u +%Y%m%dT%H%M%SZ).sql.gz
            if pg_dump -h history -U postgres -d "$$db" -t news_items -t news_triggers --data-only --column-inserts --rows-per-insert=200 --on-conflict-do-nothing | gzip > "$$f.part"; then
              mv "$$f.part" "$$f" && echo "backed up $$f ($$(du -h "$$f" | cut -f1))"
            else
              rm -f "$$f.part"; echo "backup of $$db failed (no news archive yet?)"
            fi
            ls -1t /backups/$$db-*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm -f
          done
          now=$$(date -u +%s); next=$$(( now / 86400 * 86400 + 37800 )); [ "$$next" -le "$$now" ] && next=$$(( next + 86400 ))
          sleep $$(( next - now ))
        done
    volumes:
      - ./backups/history:/backups
    networks: [ai]
    mem_limit: 256m
    logging: *logging

  # Puts the local model's file into the models volume before llm starts: downloaded from Hugging
  # Face at a pinned commit and checked against its SHA-256 (12.3 GB, a few minutes). A file already
  # there and checked is kept, so this exits at once on later starts.
  llm-model:
    image: alpine:3.21@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507
    container_name: marketbots-llm-model
    restart: "no"
    security_opt:
      - no-new-privileges:true
    environment:
      MODEL_URL: https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/resolve/a483e9e6cbd595906af30beda3187c2663a1118c/Qwen3.6-35B-A3B-UD-Q2_K_XL.gguf
      MODEL_FILE: Qwen3.6-35B-A3B-UD-Q2_K_XL.gguf
      MODEL_SHA256: 96b9c0af5c77a4ecaabe3983175112b5ece763261c1ece12b2494b692a70dad7
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        cd /models
        if [ -f "$$MODEL_FILE" ] && [ "$$(cat "$$MODEL_FILE.sha256ok" 2>/dev/null)" = "$$MODEL_SHA256" ]; then echo "have $$MODEL_FILE"; exit 0; fi
        apk add --no-cache curl >/dev/null
        echo "downloading $$MODEL_FILE"
        curl -sSfL --retry 5 --retry-delay 10 -C - -o "$$MODEL_FILE.part" "$$MODEL_URL"
        got=$$(sha256sum "$$MODEL_FILE.part" | cut -d' ' -f1)
        if [ "$$got" != "$$MODEL_SHA256" ]; then echo "SHA-256 mismatch ($$got): download removed"; rm -f "$$MODEL_FILE.part"; exit 1; fi
        mv "$$MODEL_FILE.part" "$$MODEL_FILE"
        echo "$$MODEL_SHA256" > "$$MODEL_FILE.sha256ok"
        echo "fetched and checked $$MODEL_FILE"
    volumes:
      - models:/models
    mem_limit: 256m
    logging: *logging

  # The local model (docs/plans/LOCAL-AI.md §5): llama.cpp's server with Qwen 3.6 35B-A3B at 2-bit,
  # split across both GPUs and loaded at all times. Three slots share one 96k-token KV cache. It
  # writes the article summaries, and serves AiRunner's local/* models. No host port and no
  # internet: only the engines reach it, over the `ai` network. A start takes ~1 minute; the
  # first one ~2–3, while the CUDA kernels are compiled (kept in llm-cache after that).
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:8c219fe0367f7e794e3c69da50c5992d474077d60794a218b9e9a3b0c5aed688
    container_name: marketbots-llm
    restart: unless-stopped
    depends_on:
      llm-model:
        condition: service_completed_successfully
    environment:
      # The 2080 SUPER first, then the 3070 (nvidia-smi -L). By UUID: Windows and WSL may number
      # the cards differently.
      CUDA_VISIBLE_DEVICES: GPU-c2f63837-86e4-7c90-764a-3de017193048,GPU-0a8e2594-2e3d-878a-20b6-c967e92bc4f8
      CUDA_CACHE_PATH: /cache
      CUDA_CACHE_MAXSIZE: "4294967296"
    command:
      - --model
      - /models/Qwen3.6-35B-A3B-UD-Q2_K_XL.gguf
      - --alias
      - qwen3.6-35b-a3b-q2
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      # One slot per bot and one for news, sharing one KV cache (q8_0).
      - --parallel
      - "3"
      - --kv-unified
      - --ctx-size
      - "98304"
      - --flash-attn
      - "on"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      # Layers (and experts, if it must) placed to leave 512 MB free on the 2080 SUPER and 1 GB
      # on the 3070, for the display and Jellyfin's transcodes.
      - --fit
      - "on"
      - --fit-target
      - "512,1024"
      # Read the whole file at load: memory-mapped experts were paged in on first use, and slowly.
      - --load-mode
      - none
      - --jinja
      - --metrics
    volumes:
      - models:/models:ro
      - llm-cache:/cache
    networks: [ai]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    mem_limit: 6g
    # llama.cpp runs 6 threads, which spin while they wait: capped at 4 CPUs they were throttled
    # (36–40 tokens/s against 45–46 at 6). Idle, it uses next to none.
    cpus: 6
    logging: *logging

volumes:
  # THE paper wallet, created by the old cryptomarketbot compose project. `external` stops compose
  # from creating an empty marketbots_kraken-paper, which the engine would see as a wallet reset.
  kraken-paper:
    external: true
    name: cryptomarketbot_kraken-paper
  # The local model's files (llm-model fetches the one in use; others may sit beside it).
  models:
  # The CUDA kernels the driver compiled for llm's first start.
  llm-cache:
  # The history store's data (docs/plans/LOCAL-AI.md §6). The news archive in it is backed up
  # nightly (history-backup); everything else the backfills can fetch again.
  history-data:

networks:
  default:
  # The AI side (docs/plans/LOCAL-AI.md §4): no internet. The history store sits only here; the
  # engines join it beside the default network.
  ai:
    internal: true
