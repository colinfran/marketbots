# The marketbots stack on the trading server: both engines, both dashboards, their MongoDB, one
# shared scraper, the local model server and the history store. Caddy on the host serves the
# dashboards and the engines' streams; the landing page stays on Vercel.
#
#   docker compose up -d --build stock-engine            redeploy one engine; the other is untouched
#   docker compose logs -f crypto-engine                 follow one engine's structured logs
#   docker compose up -d llm                             (re)start the local model server
#
# The dashboards deploy themselves on every commit to main here (the repo's git hooks start
# docker/web/autodeploy.mjs, which builds from a clean checkout of the commit; docs/SERVER.md §8).
# Running `up -d --build` without names would rebuild them from this working tree instead.
#
# The two bots share nothing at runtime: separate images, containers, ports, variables,
# databases and database users (one history database each, too) and leases. See docs/SERVER.md.
#
# Every secret and setting is in .env at the repo root (template .env.example; docs/SERVER.md §3),
# which compose reads by itself. Each service below takes only its own variables, under the names its
# code reads: crypto-engine's MONGODB_DB_NAME is .env's CRYPTO_MONGODB_DB_NAME. A variable that isn't
# in .env arrives empty, which the engines read as unset. A new variable goes into .env.example and
# into the environment of each service that reads it.

name: marketbots

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# What both engines read: .env's SHARED section, and the addresses of the stack's own services.
# (Each builds its own MONGODB_URI, below: its own database user on the stack's `mongo`.)
x-engine-env: &engine-env
  SEC_USER_AGENT: ${SEC_USER_AGENT:-}
  FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
  FRED_API_KEY: ${FRED_API_KEY:-}
  BLS_API_KEY: ${BLS_API_KEY:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  EXA_API_KEY: ${EXA_API_KEY:-}
  BRIGHTDATA_API_KEY: ${BRIGHTDATA_API_KEY:-}
  BRIGHTDATA_ZONE: ${BRIGHTDATA_ZONE:-}
  STREAM_HOST: 0.0.0.0
  SCRAPER_URL: http://scraper:8790
  LLM_URL: http://llm:8080
  SEARCH_URL: http://search:8080
  LOG_DIR: /logs

services:
  crypto-engine:
    <<: *hardened
    build:
      context: .
      dockerfile: apps/crypto-engine/Dockerfile
    image: marketbots-crypto-engine:latest
    container_name: marketbots-crypto-engine
    environment:
      <<: *engine-env
      STREAM_PORT: 8787
      # Its own database user, which can't see stock's database (docker/mongo/init.js).
      MONGODB_URI: mongodb://crypto_engine:${MONGO_CRYPTO_ENGINE_PASSWORD:-}@mongo:27017/?authSource=admin&replicaSet=rs0
      KRAKEN_OHLCVT_DIR: /data/ohlcvt
      # Its own history database, with the password the history service created its role with.
      HISTORY_URL: postgres://crypto_history:${HISTORY_CRYPTO_PASSWORD:-}@history:5432/crypto_history
      MONGODB_DB_NAME: ${CRYPTO_MONGODB_DB_NAME:-}
      STREAM_TOKEN_SECRET: ${CRYPTO_STREAM_TOKEN_SECRET:-}
      STREAM_ALLOWED_ORIGINS: ${CRYPTO_STREAM_ALLOWED_ORIGINS:-}
      STREAM_TRUST_PROXY: ${CRYPTO_STREAM_TRUST_PROXY:-}
      STREAM_MAX_CLIENTS: ${CRYPTO_STREAM_MAX_CLIENTS:-}
      LOG_LEVEL: ${CRYPTO_LOG_LEVEL:-}
      ENGINE_INSTANCE: ${CRYPTO_ENGINE_INSTANCE:-}
      DISCORD_WEBHOOK_URL: ${CRYPTO_DISCORD_WEBHOOK_URL:-}
      DASHBOARD_URL: ${CRYPTO_DASHBOARD_URL:-}
      EVENT_RETENTION_DAYS: ${CRYPTO_EVENT_RETENTION_DAYS:-}
      KRAKEN_WORKSPACE: ${CRYPTO_KRAKEN_WORKSPACE:-}
      KRAKEN_CLI_TIMEOUT_MS: ${CRYPTO_KRAKEN_CLI_TIMEOUT_MS:-}
      COINGECKO_API_KEY: ${CRYPTO_COINGECKO_API_KEY:-}
      ETHERSCAN_API_KEY: ${CRYPTO_ETHERSCAN_API_KEY:-}
      COINALYZE_API_KEY: ${CRYPTO_COINALYZE_API_KEY:-}
    ports:
      # Loopback only: Caddy on the host forwards wss://engine.cryptomarketbot.app here, and the
      # dashboard reaches it through host.docker.internal.
      - "127.0.0.1:8787:8787"
    networks: [default, ai, db]
    volumes:
      # The Kraken CLI paper wallet (balances + trade journal). Losing it means a paper reset.
      - kraken-paper:/data/kraken
      # The log history, one file per UTC day, on the host disk: a deploy replaces Docker's log,
      # not this. docs/SERVER.md §5.2.
      - ./logs/crypto-engine:/logs
      # Kraken's OHLCVT history for the history backfill (docs/SERVER.md §6.5); read-only. An empty
      # or missing folder just means nothing to import.
      - ./data/kraken-ohlcvt/csv:/data/ohlcvt:ro
    stop_grace_period: 30s
    mem_limit: 1g
    logging: *logging

  stock-engine:
    <<: *hardened
    build:
      context: .
      dockerfile: apps/stock-engine/Dockerfile
    image: marketbots-stock-engine:latest
    container_name: marketbots-stock-engine
    environment:
      <<: *engine-env
      STREAM_PORT: 8788
      MONGODB_URI: mongodb://stock_engine:${MONGO_STOCK_ENGINE_PASSWORD:-}@mongo:27017/?authSource=admin&replicaSet=rs0
      HISTORY_URL: postgres://stock_history:${HISTORY_STOCK_PASSWORD:-}@history:5432/stock_history
      MONGODB_DB_NAME: ${STOCK_MONGODB_DB_NAME:-}
      STREAM_TOKEN_SECRET: ${STOCK_STREAM_TOKEN_SECRET:-}
      STREAM_ALLOWED_ORIGINS: ${STOCK_STREAM_ALLOWED_ORIGINS:-}
      STREAM_TRUST_PROXY: ${STOCK_STREAM_TRUST_PROXY:-}
      STREAM_MAX_CLIENTS: ${STOCK_STREAM_MAX_CLIENTS:-}
      LOG_LEVEL: ${STOCK_LOG_LEVEL:-}
      ENGINE_INSTANCE: ${STOCK_ENGINE_INSTANCE:-}
      DISCORD_WEBHOOK_URL: ${STOCK_DISCORD_WEBHOOK_URL:-}
      DASHBOARD_URL: ${STOCK_DASHBOARD_URL:-}
      EVENT_RETENTION_DAYS: ${STOCK_EVENT_RETENTION_DAYS:-}
      ALPACA_API_KEY: ${STOCK_ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${STOCK_ALPACA_SECRET_KEY:-}
      ALPACA_DATA_FEED: ${STOCK_ALPACA_DATA_FEED:-}
      STARTING_CAPITAL: ${STOCK_STARTING_CAPITAL:-}
      OPENFDA_API_KEY: ${STOCK_OPENFDA_API_KEY:-}
      MASSIVE_API_KEY: ${STOCK_MASSIVE_API_KEY:-}
      EIA_API_KEY: ${STOCK_EIA_API_KEY:-}
    ports:
      # Loopback only: Caddy on the host forwards wss://engine.stockmarketbot.app here, and the
      # dashboard reaches it through host.docker.internal.
      - "127.0.0.1:8788:8788"
    networks: [default, ai, db]
    volumes:
      # The log history (see crypto-engine).
      - ./logs/stock-engine:/logs
    stop_grace_period: 30s
    # Up from 768 MB: headroom at the open with ~1,500 tracked symbols.
    mem_limit: 1g
    logging: *logging

  # The crypto dashboard (https://cryptomarketbot.app): its Next.js standalone server
  # (docker/web/Dockerfile), behind Caddy on the host. Its server calls the engine's signed API and
  # the host agent through host.docker.internal (the host's 127.0.0.1), and MongoDB over `db` as
  # crypto_web, which reads crypto's database and writes only sign-ins and audit entries
  # (docker/mongo/init.js). On `web`, not `default`: it can't reach the scraper or search. Deployed
  # by docker/web/autodeploy.mjs on every commit to main (docs/SERVER.md §8).
  crypto-web:
    <<: *hardened
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        APP: crypto-web
        CORE: crypto-core
        NEXT_PUBLIC_DISPLAY_TIMEZONE: ${NEXT_PUBLIC_DISPLAY_TIMEZONE:-America/Los_Angeles}
    image: marketbots-crypto-web:latest
    container_name: marketbots-crypto-web
    environment:
      MONGODB_URI: mongodb://crypto_web:${MONGO_CRYPTO_WEB_PASSWORD:-}@mongo:27017/?authSource=admin&replicaSet=rs0
      MONGODB_DB_NAME: ${CRYPTO_MONGODB_DB_NAME:-}
      # Sign-in links point here.
      SITE_URL: ${CRYPTO_SITE_URL:-https://cryptomarketbot.app}
      # The browser's stream (through Caddy), and the server's own way to the engine.
      ENGINE_STREAM_URL: ${CRYPTO_ENGINE_STREAM_URL:-}
      ENGINE_URL: http://host.docker.internal:8787
      STREAM_TOKEN_SECRET: ${CRYPTO_STREAM_TOKEN_SECRET:-}
      BETTER_AUTH_SECRET: ${CRYPTO_BETTER_AUTH_SECRET:-}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      USESEND_API_KEY: ${USESEND_API_KEY:-}
      USESEND_BASE_URL: ${USESEND_BASE_URL:-}
      USESEND_FROM_EMAIL: ${CRYPTO_USESEND_FROM_EMAIL:-}
      DISCORD_WEBHOOK_URL: ${CRYPTO_DISCORD_WEBHOOK_URL:-}
      HOST_API_URL: http://host.docker.internal:8789
      HOST_API_SECRET: ${HOST_API_SECRET:-}
    ports:
      # Loopback only: Caddy on the host forwards https://cryptomarketbot.app here.
      - "127.0.0.1:3101:3000"
    networks: [web, db]
    tmpfs:
      - /tmp
      # Next's fetch cache (the candles route's Kraken calls).
      - /app/apps/crypto-web/.next/cache:uid=1000,gid=1000
    stop_grace_period: 10s
    mem_limit: 512m
    logging: *logging

  # The stock dashboard (https://stockmarketbot.app), like crypto-web, as stock_web.
  stock-web:
    <<: *hardened
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        APP: stock-web
        CORE: stock-core
        NEXT_PUBLIC_DISPLAY_TIMEZONE: ${NEXT_PUBLIC_DISPLAY_TIMEZONE:-America/Los_Angeles}
    image: marketbots-stock-web:latest
    container_name: marketbots-stock-web
    environment:
      MONGODB_URI: mongodb://stock_web:${MONGO_STOCK_WEB_PASSWORD:-}@mongo:27017/?authSource=admin&replicaSet=rs0
      MONGODB_DB_NAME: ${STOCK_MONGODB_DB_NAME:-}
      SITE_URL: ${STOCK_SITE_URL:-https://stockmarketbot.app}
      ENGINE_STREAM_URL: ${STOCK_ENGINE_STREAM_URL:-}
      ENGINE_URL: http://host.docker.internal:8788
      STREAM_TOKEN_SECRET: ${STOCK_STREAM_TOKEN_SECRET:-}
      BETTER_AUTH_SECRET: ${STOCK_BETTER_AUTH_SECRET:-}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      USESEND_API_KEY: ${USESEND_API_KEY:-}
      USESEND_BASE_URL: ${USESEND_BASE_URL:-}
      USESEND_FROM_EMAIL: ${STOCK_USESEND_FROM_EMAIL:-}
      DISCORD_WEBHOOK_URL: ${STOCK_DISCORD_WEBHOOK_URL:-}
      HOST_API_URL: http://host.docker.internal:8789
      HOST_API_SECRET: ${HOST_API_SECRET:-}
    ports:
      # Loopback only: Caddy on the host forwards https://stockmarketbot.app here.
      - "127.0.0.1:3102:3000"
    networks: [web, db]
    tmpfs:
      - /tmp
      - /app/apps/stock-web/.next/cache:uid=1000,gid=1000
    stop_grace_period: 10s
    mem_limit: 512m
    logging: *logging

  # Both bots' MongoDB (docs/SERVER.md §6.6): a single-member replica set "rs0" (Better Auth's
  # sign-in writes use transactions, which need one) with auth on: a user per engine, per dashboard
  # and for the backup, each limited to what it does (docker/mongo/init.js, run once per new volume
  # and after a MONGO_* password changes). No host port and no internet: only the engines, the
  # dashboards and mongo-backup reach it, over `db`. Its data is the mongo-data volume, the books of
  # both bots: never removed (AGENTS.md rule 6). Recreating it pauses both bots' database for a few
  # seconds (they retry): do it at a quiet time. Network compression stays off (CVE-2025-14847).
  mongo:
    image: mongo:8.0.34@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
    container_name: marketbots-mongo
    restart: unless-stopped
    user: "999:999"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # docker/mongo/start.sh writes a fresh keyFile (needed by a replica set with auth) to tmpfs,
    # then runs the image's own entrypoint.
    entrypoint: ["sh", "/etc/mongo/start.sh"]
    command: [mongod, --replSet, rs0, --keyFile, /run/mongo/keyfile, --bind_ip_all, --quiet, --wiredTigerCacheSizeGB, "0.5", --networkMessageCompressors, disabled]
    environment:
      # Read only by docker/mongo/init.js (docs/SERVER.md §3.8).
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
      MONGO_CRYPTO_ENGINE_PASSWORD: ${MONGO_CRYPTO_ENGINE_PASSWORD:-}
      MONGO_STOCK_ENGINE_PASSWORD: ${MONGO_STOCK_ENGINE_PASSWORD:-}
      MONGO_CRYPTO_WEB_PASSWORD: ${MONGO_CRYPTO_WEB_PASSWORD:-}
      MONGO_STOCK_WEB_PASSWORD: ${MONGO_STOCK_WEB_PASSWORD:-}
      MONGO_BACKUP_PASSWORD: ${MONGO_BACKUP_PASSWORD:-}
      CRYPTO_DB: ${CRYPTO_MONGODB_DB_NAME:-cryptomarketbot}
      STOCK_DB: ${STOCK_MONGODB_DB_NAME:-stockmarketbot}
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo/start.sh:/etc/mongo/start.sh:ro
      - ./docker/mongo/init.js:/etc/mongo/init.js:ro
    tmpfs:
      - /tmp
      - /run/mongo:uid=999,gid=999
      - /data/configdb:uid=999,gid=999
    networks: [db]
    healthcheck:
      # ping needs no user.
      test: ["CMD", "mongosh", "--quiet", "--norc", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 60s
    mem_limit: 1536m
    logging: *logging

  # Daily copy of both bots' databases (users and roles included) to backups/mongo/ on the host
  # disk, which survives a Docker or WSL reset: one consistent snapshot (--oplog) of the whole
  # server. Once at start, then daily at 11:00 UTC; the newest 14 kept. Restore: docs/SERVER.md §6.6.
  mongo-backup:
    image: mongo:8.0.34@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
    container_name: marketbots-mongo-backup
    restart: unless-stopped
    user: "999:999"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      MONGO_BACKUP_PASSWORD: ${MONGO_BACKUP_PASSWORD:-}
    entrypoint: ["sh", "-c"]
    command:
      - |
        umask 077
        # The password goes to mongodump in a file on tmpfs, never on a command line.
        printf 'password: "%s"\n' "$$MONGO_BACKUP_PASSWORD" > /tmp/mongodump.yml
        backup() {
          f=/backups/mongo-$$(date -u +%Y%m%dT%H%M%SZ).archive.gz
          if mongodump --config=/tmp/mongodump.yml --host=rs0/mongo:27017 --username=backup --authenticationDatabase=admin --oplog --gzip --archive="$$f.part" --quiet; then
            mv "$$f.part" "$$f" && echo "backed up $$f ($$(du -h "$$f" | cut -f1))"
            ls -1t /backups/mongo-*.archive.gz | tail -n +15 | xargs -r rm -f
          else
            rm -f "$$f.part"; echo "backup failed"; return 1
          fi
        }
        until backup; do echo "retrying in 5 minutes"; sleep 300; done
        while true; do
          now=$$(date -u +%s); next=$$(( now / 86400 * 86400 + 39600 )); [ "$$next" -le "$$now" ] && next=$$(( next + 86400 ))
          sleep $$(( next - now ))
          backup || true
        done
    volumes:
      - ./backups/mongo:/backups
    networks: [db]
    mem_limit: 512m
    logging: *logging

  # A MongoDB for local dev (`pnpm dev:<bot>-*`, docs/SERVER.md §3.5), never the live data: a
  # one-member replica set (for Better Auth's transactions) without auth, on loopback. Not part of
  # `up` (profile "dev"): docker compose --profile dev up -d mongo-dev. Its healthcheck initiates the
  # replica set on a new volume.
  mongo-dev:
    profiles: ["dev"]
    image: mongo:8.0.34@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
    container_name: marketbots-mongo-dev
    restart: unless-stopped
    command: [mongod, --replSet, rs0, --bind_ip_all, --quiet, --wiredTigerCacheSizeGB, "0.25", --networkMessageCompressors, disabled]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo-dev-data:/data/db
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--norc", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }"]
      interval: 10s
      timeout: 10s
      retries: 3
    mem_limit: 512m
    logging: *logging

  # Headless Chromium for news sources that need JavaScript, shared by both engines. No ports:
  # only the engines reach it. If it dies, only the headless sources go down.
  scraper:
    <<: *hardened
    build:
      context: .
      dockerfile: apps/scraper/Dockerfile
    image: marketbots-scraper:latest
    container_name: marketbots-scraper
    init: true
    mem_limit: 1g
    logging:
      <<: *logging
      options:
        max-size: "10m"
        max-file: "3"

  # Nightly copy of the paper wallet to backups/kraken/ on the host disk,
  # which survives a Docker or WSL reset. One at start, then daily at 10:00 UTC; the newest 14 kept.
  # Restore: docs/SERVER.md.
  wallet-backup:
    image: node:22-bookworm-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d
    container_name: marketbots-wallet-backup
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/kraken-paper-$$(date -u +%Y%m%dT%H%M%SZ).tgz
          tar -czf "$$f.part" -C /data . && mv "$$f.part" "$$f" && echo "backed up $$f ($$(du -h "$$f" | cut -f1))"
          ls -1t /backups/kraken-paper-*.tgz | tail -n +15 | xargs -r rm -f
          sleep $$(( $$(date -u -d 'tomorrow 10:00' +%s) - $$(date -u +%s) ))
        done
    volumes:
      - kraken-paper:/data:ro
      - ./backups/kraken:/backups
    mem_limit: 64m
    logging: *logging

  # The history store (docs/plans/LOCAL-AI.md §6): Postgres with TimescaleDB and pgvector, one
  # database and role per bot (crypto_history, stock_history; created on the first start by
  # packages/history/docker/initdb.sh), the tables from the engines' migrations. No host port and
  # no internet: only the engines reach it, over the `ai` network. Its data lives in the
  # history-data volume, inside Docker's disk on C:. If it's down, only history stops.
  history:
    image: timescale/timescaledb:2.31.0-pg17@sha256:b56a3f51991df1f79d0c1a0841cad5c5fa8058fdd6a3ee6886394a6d4c174538
    container_name: marketbots-history
    restart: unless-stopped
    environment:
      # The passwords take effect only when the history-data volume is created (docs/SERVER.md §3.6).
      POSTGRES_PASSWORD: ${HISTORY_POSTGRES_PASSWORD:-}
      CRYPTO_HISTORY_PASSWORD: ${HISTORY_CRYPTO_PASSWORD:-}
      STOCK_HISTORY_PASSWORD: ${HISTORY_STOCK_PASSWORD:-}
      HISTORY_DATABASES: crypto_history stock_history
      # timescaledb-tune sizes shared_buffers and workers for this, not for the whole VM.
      TS_TUNE_MEMORY: 2GB
      TS_TUNE_NUM_CPUS: 2
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - history-data:/var/lib/postgresql/data
      - ./packages/history/docker/initdb.sh:/docker-entrypoint-initdb.d/10-history.sh:ro
    networks: [ai]
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 2g
    logging: *logging

  # Nightly copy of the news archive (the one part of the history store nothing can fetch again)
  # to backups/history/ on the host disk, which survives a Docker or WSL reset. Once at start, then
  # daily at 10:30 UTC; the newest 7 per database kept. Bars aren't backed up: the backfills
  # rebuild them. Restore: docs/SERVER.md §6.4.
  history-backup:
    image: timescale/timescaledb:2.31.0-pg17@sha256:b56a3f51991df1f79d0c1a0841cad5c5fa8058fdd6a3ee6886394a6d4c174538
    container_name: marketbots-history-backup
    restart: unless-stopped
    user: "70:70"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      POSTGRES_PASSWORD: ${HISTORY_POSTGRES_PASSWORD:-}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -o pipefail
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        until pg_isready -q -h history -U postgres; do sleep 10; done
        while true; do
          for db in crypto_history stock_history; do
            f=/backups/$$db-$$(date -u +%Y%m%dT%H%M%SZ).sql.gz
            if pg_dump -h history -U postgres -d "$$db" -t news_items -t news_triggers --data-only --column-inserts --rows-per-insert=200 --on-conflict-do-nothing | gzip > "$$f.part"; then
              mv "$$f.part" "$$f" && echo "backed up $$f ($$(du -h "$$f" | cut -f1))"
            else
              rm -f "$$f.part"; echo "backup of $$db failed (no news archive yet?)"
            fi
            ls -1t /backups/$$db-*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm -f
          done
          now=$$(date -u +%s); next=$$(( now / 86400 * 86400 + 37800 )); [ "$$next" -le "$$now" ] && next=$$(( next + 86400 ))
          sleep $$(( next - now ))
        done
    volumes:
      - ./backups/history:/backups
    networks: [ai]
    mem_limit: 256m
    logging: *logging

  # The search service for local research (docs/SERVER.md §9): SearXNG asks the news engines
  # that answer from our IP and, only when research names them, the paid ones through the
  # residential proxy (SEARCH_PROXY_URL in .env). It answers the engines in JSON. On the default
  # network (it needs the internet), with no host port. Its secret is random at every start.
  search:
    <<: *hardened
    image: searxng/searxng:2026.10.13-22c64b8d3@sha256:9b61996edcc679fb6665290f95fda15389a14eda6060e41a25c63ab2758f2436
    container_name: marketbots-search
    user: "977:977"
    tmpfs:
      - /tmp
      - /var/cache/searxng:uid=977,gid=977
    entrypoint: ["sh", "/etc/searxng/start.sh"]
    environment:
      SEARCH_PROXY_URL: ${SEARCH_PROXY_URL:-}
    volumes:
      - ./packages/wire/docker/searxng.yml:/etc/searxng/settings.yml:ro
      - ./packages/wire/docker/searxng-start.sh:/etc/searxng/start.sh:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--header", "X-Real-IP: 127.0.0.1", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 512m
    logging: *logging

  # Puts the local model's file into the models volume: downloaded from Hugging Face at a pinned
  # commit and checked against its SHA-256 (12.3 GB, a few minutes). A file already there and
  # checked is kept. Not part of `up` (profile "setup"), so no stopped container sits in the stack:
  # run it on a new server or after changing the model, before starting llm (docs/SERVER.md §9):
  #   docker compose --profile setup run --rm llm-model
  llm-model:
    profiles: ["setup"]
    image: alpine:3.21@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507
    security_opt:
      - no-new-privileges:true
    environment:
      MODEL_URL: https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/resolve/a483e9e6cbd595906af30beda3187c2663a1118c/Qwen3.6-35B-A3B-UD-Q2_K_XL.gguf
      MODEL_FILE: Qwen3.6-35B-A3B-UD-Q2_K_XL.gguf
      MODEL_SHA256: 96b9c0af5c77a4ecaabe3983175112b5ece763261c1ece12b2494b692a70dad7
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        cd /models
        if [ -f "$$MODEL_FILE" ] && [ "$$(cat "$$MODEL_FILE.sha256ok" 2>/dev/null)" = "$$MODEL_SHA256" ]; then echo "have $$MODEL_FILE"; exit 0; fi
        apk add --no-cache curl >/dev/null
        echo "downloading $$MODEL_FILE"
        curl -sSfL --retry 5 --retry-delay 10 -C - -o "$$MODEL_FILE.part" "$$MODEL_URL"
        got=$$(sha256sum "$$MODEL_FILE.part" | cut -d' ' -f1)
        if [ "$$got" != "$$MODEL_SHA256" ]; then echo "SHA-256 mismatch ($$got): download removed"; rm -f "$$MODEL_FILE.part"; exit 1; fi
        mv "$$MODEL_FILE.part" "$$MODEL_FILE"
        echo "$$MODEL_SHA256" > "$$MODEL_FILE.sha256ok"
        echo "fetched and checked $$MODEL_FILE"
    volumes:
      - models:/models
    mem_limit: 256m
    logging: *logging

  # The local model (docs/plans/LOCAL-AI.md §5): llama.cpp's server with Qwen 3.6 35B-A3B at 2-bit,
  # split across both GPUs and loaded at all times. Three slots share one 96k-token KV cache. It
  # writes the article summaries, and serves AiRunner's local/* models. No host port and no
  # internet: only the engines reach it, over the `ai` network. A start takes ~1 minute; the
  # first one ~2–3, while the CUDA kernels are compiled (kept in llm-cache after that). Its model
  # file must be in the models volume first: llm-model puts it there.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:8c219fe0367f7e794e3c69da50c5992d474077d60794a218b9e9a3b0c5aed688
    container_name: marketbots-llm
    restart: unless-stopped
    environment:
      # The 2080 SUPER first, then the 3070 (nvidia-smi -L). By UUID: Windows and WSL may number
      # the cards differently.
      CUDA_VISIBLE_DEVICES: GPU-c2f63837-86e4-7c90-764a-3de017193048,GPU-0a8e2594-2e3d-878a-20b6-c967e92bc4f8
      CUDA_CACHE_PATH: /cache
      CUDA_CACHE_MAXSIZE: "4294967296"
    command:
      - --model
      - /models/Qwen3.6-35B-A3B-UD-Q2_K_XL.gguf
      - --alias
      - qwen3.6-35b-a3b-q2
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      # One slot per bot and one for news, sharing one KV cache (q8_0).
      - --parallel
      - "3"
      - --kv-unified
      - --ctx-size
      - "98304"
      - --flash-attn
      - "on"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      # Recent prompts kept in RAM, so a new request can reuse their start. llama.cpp's default is
      # 8 GB, more than the container's 6: at the default it sat at the cap, swapped 3.6 GB and froze
      # the Docker VM for seconds at a time.
      - --cache-ram
      - "2048"
      # Layers (and experts, if it must) placed to leave 512 MB free on the 2080 SUPER and 1 GB
      # on the 3070, for the display and Jellyfin's transcodes.
      - --fit
      - "on"
      - --fit-target
      - "512,1024"
      # Read the whole file at load: memory-mapped experts were paged in on first use, and slowly.
      - --load-mode
      - none
      - --jinja
      - --metrics
    volumes:
      - models:/models:ro
      - llm-cache:/cache
    networks: [ai]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    mem_limit: 6g
    # llama.cpp runs 6 threads, which spin while they wait: capped at 4 CPUs they were throttled
    # (36–40 tokens/s against 45–46 at 6). Idle, it uses next to none.
    cpus: 6
    logging: *logging

volumes:
  # THE paper wallet, created by the old cryptomarketbot compose project. `external` stops compose
  # from creating an empty marketbots_kraken-paper, which the engine would see as a wallet reset.
  kraken-paper:
    external: true
    name: cryptomarketbot_kraken-paper
  # The local model's files (llm-model fetches the one in use; others may sit beside it).
  models:
  # The CUDA kernels the driver compiled for llm's first start.
  llm-cache:
  # The history store's data (docs/plans/LOCAL-AI.md §6). The news archive in it is backed up
  # nightly (history-backup); everything else the backfills can fetch again.
  history-data:
  # THE books of both bots (mongo). `external`, like the wallet, so compose never creates an empty
  # one: the crypto engine would see a fresh database and reset the paper wallet to match. Created
  # once by hand (docs/SERVER.md §6.6); backed up daily (mongo-backup).
  mongo-data:
    external: true
    name: marketbots_mongo-data
  # mongo-dev's throwaway data.
  mongo-dev-data:

networks:
  default:
  # The AI side (docs/plans/LOCAL-AI.md §4): no internet. The history store sits only here; the
  # engines join it beside the default network.
  ai:
    internal: true
  # The database side: no internet. mongo and mongo-backup sit only here; the engines and the
  # dashboards join it.
  db:
    internal: true
  # The dashboards' own network, with internet (useSend, Discord, Kraken's candles) but without the
  # scraper or search.
  web:
