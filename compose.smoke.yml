# Boot test for new engine and dashboard images, beside the live stack (docs/SERVER.md §6.3).
#
#   docker compose build                                            build the images first
#   docker compose -f compose.smoke.yml up -d                       boot both engines and dashboards (MB_TAG=<tag> for other images)
#   http://127.0.0.1:13101, http://127.0.0.1:13102                   the dashboards (public view: no sign-in here)
#   docker compose -f compose.smoke.yml ps / logs -f crypto-engine
#   docker compose -f compose.smoke.yml down && docker volume rm marketbots-smoke_wallet
#
# (Not `down -v`: this file also declares the LIVE wallet volume. It is external, so compose
# shouldn't remove it, but there is no reason to rely on that.)
#
# Safe beside the live engines by construction: its own project name, a throwaway MongoDB in memory
# (nothing touches the live one) and history store (crypto_staging, stock_staging, in memory), loopback ports 18787/18788, a COPY of the paper wallet, fake Alpaca
# keys (the live ones would knock out the live engine's market-data stream: one connection per
# account), and no AI, Discord, email or news API keys. No local model either: the live `llm` fills
# both GPUs, so there is no LLM_URL here and article summaries stay off.
#
# The crypto engine resets the paper workspace when its database is fresh ("paper workspace reset
# to match a fresh database"), which is why it only ever gets the copy here. Never start the live
# wallet volume against a new or renamed database.

name: marketbots-smoke

x-engine: &engine
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  mem_limit: 1g
  depends_on:
    mongo:
      condition: service_healthy

services:
  # The live stack's MongoDB version, as a one-member replica set like it (Better Auth's sign-in
  # writes need one), without auth. The healthcheck initiates the replica set.
  mongo:
    image: mongo:8.0.34@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
    command: [mongod, --replSet, rs0, --bind_ip_all, --quiet, --networkMessageCompressors, disabled]
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--norc", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20
    mem_limit: 1g

  # Copies the live wallet (read-only) into a throwaway volume, so the smoke engine can't touch it.
  wallet-copy:
    image: node:22-bookworm-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d
    user: "0"
    command: ["sh", "-c", "rm -rf /to/* /to/.[!.]* 2>/dev/null; cp -a /from/. /to/ && echo copied"]
    volumes:
      - live-wallet:/from:ro
      - wallet:/to

  crypto-engine:
    <<: *engine
    image: marketbots-crypto-engine:${MB_TAG:-latest}
    environment:
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGODB_DB_NAME: cryptomarketbot_staging
      STREAM_TOKEN_SECRET: smoke-test-secret-0123456789abcdef0123456789abcdef
      STREAM_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:13101,http://127.0.0.1:13102
      STREAM_PORT: 8787
      KRAKEN_WORKSPACE: cryptomarketbot
      SCRAPER_URL: http://scraper:8790
      HISTORY_URL: postgres://crypto_staging:smoke-crypto-history@history:5432/crypto_staging
      ENGINE_INSTANCE: smoke
      # The log files go to tmpfs here, never to the live stack's logs/ folder.
      LOG_DIR: /tmp/logs
    ports:
      - "127.0.0.1:18787:8787"
    volumes:
      - wallet:/data/kraken
    depends_on:
      mongo:
        condition: service_healthy
      wallet-copy:
        condition: service_completed_successfully

  stock-engine:
    <<: *engine
    image: marketbots-stock-engine:${MB_TAG:-latest}
    environment:
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGODB_DB_NAME: stockmarketbot_staging
      ALPACA_API_KEY: SMOKE-FAKE-KEY
      ALPACA_SECRET_KEY: SMOKE-FAKE-SECRET
      STREAM_TOKEN_SECRET: smoke-test-secret-0123456789abcdef0123456789abcdef
      STREAM_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:13101,http://127.0.0.1:13102
      STREAM_PORT: 8788
      SCRAPER_URL: http://scraper:8790
      HISTORY_URL: postgres://stock_staging:smoke-stock-history@history:5432/stock_staging
      ENGINE_INSTANCE: smoke
      LOG_DIR: /tmp/logs
    ports:
      - "127.0.0.1:18788:8788"

  # The dashboard images against the smoke engines and their staging databases, on loopback 13101
  # and 13102 (where Vercel's preview deployments used to be). No sign-in (no auth secret or email
  # here): the public view, with the engines' status and stream.
  crypto-web:
    <<: *engine
    image: marketbots-crypto-web:${MB_TAG:-latest}
    mem_limit: 512m
    environment:
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGODB_DB_NAME: cryptomarketbot_staging
      SITE_URL: http://127.0.0.1:13101
      ENGINE_STREAM_URL: ws://127.0.0.1:18787/v1/stream
      ENGINE_URL: http://crypto-engine:8787
      STREAM_TOKEN_SECRET: smoke-test-secret-0123456789abcdef0123456789abcdef
    tmpfs:
      - /tmp
      - /app/apps/crypto-web/.next/cache:uid=1000,gid=1000
    ports:
      - "127.0.0.1:13101:3000"

  stock-web:
    <<: *engine
    image: marketbots-stock-web:${MB_TAG:-latest}
    mem_limit: 512m
    environment:
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGODB_DB_NAME: stockmarketbot_staging
      SITE_URL: http://127.0.0.1:13102
      ENGINE_STREAM_URL: ws://127.0.0.1:18788/v1/stream
      ENGINE_URL: http://stock-engine:8788
      STREAM_TOKEN_SECRET: smoke-test-secret-0123456789abcdef0123456789abcdef
    tmpfs:
      - /tmp
      - /app/apps/stock-web/.next/cache:uid=1000,gid=1000
    ports:
      - "127.0.0.1:13102:3000"

  # Its own history store, in memory: the staging databases, never the live ones.
  history:
    image: timescale/timescaledb:2.31.0-pg17@sha256:b56a3f51991df1f79d0c1a0841cad5c5fa8058fdd6a3ee6886394a6d4c174538
    environment:
      POSTGRES_PASSWORD: smoke-history-superuser
      HISTORY_DATABASES: crypto_staging stock_staging
      CRYPTO_STAGING_PASSWORD: smoke-crypto-history
      STOCK_STAGING_PASSWORD: smoke-stock-history
      TS_TUNE_MEMORY: 1GB
      TS_TUNE_NUM_CPUS: 2
      TIMESCALEDB_TELEMETRY: "off"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./packages/history/docker/initdb.sh:/docker-entrypoint-initdb.d/10-history.sh:ro
    shm_size: 256m
    mem_limit: 1g

  scraper:
    image: marketbots-scraper:${MB_TAG:-latest}
    init: true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g

volumes:
  live-wallet:
    external: true
    name: cryptomarketbot_kraken-paper
  wallet:
