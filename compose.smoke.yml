# Boot test for new engine images, beside the live stack (docs/SERVER.md §6.3).
#
#   docker compose build                                            build the images first
#   docker compose -f compose.smoke.yml up -d                       boot both engines (MB_TAG=<tag> for other images)
#   docker compose -f compose.smoke.yml ps / logs -f crypto-engine
#   docker compose -f compose.smoke.yml down && docker volume rm marketbots-smoke_wallet
#
# (Not `down -v`: this file also declares the LIVE wallet volume. It is external, so compose
# shouldn't remove it, but there is no reason to rely on that.)
#
# Safe beside the live engines by construction: its own project name, a throwaway local MongoDB
# (nothing touches the live cluster) and history store (crypto_staging, stock_staging, in memory), loopback ports 18787/18788, a COPY of the paper wallet, fake Alpaca
# keys (the live ones would knock out the live engine's market-data stream: one connection per
# account), and no AI, Discord, email or news API keys. No local model either: the live `llm` fills
# both GPUs, so there is no LLM_URL here and article summaries stay off.
#
# The crypto engine resets the paper workspace when its database is fresh ("paper workspace reset
# to match a fresh database"), which is why it only ever gets the copy here. Never start the live
# wallet volume against a new or renamed database.

name: marketbots-smoke

x-engine: &engine
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  mem_limit: 1g
  depends_on:
    mongo:
      condition: service_started

services:
  mongo:
    image: mongo:8.0
    tmpfs:
      - /data/db
    mem_limit: 1g

  # Copies the live wallet (read-only) into a throwaway volume, so the smoke engine can't touch it.
  wallet-copy:
    image: node:22-bookworm-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d
    user: "0"
    command: ["sh", "-c", "rm -rf /to/* /to/.[!.]* 2>/dev/null; cp -a /from/. /to/ && echo copied"]
    volumes:
      - live-wallet:/from:ro
      - wallet:/to

  crypto-engine:
    <<: *engine
    image: marketbots-crypto-engine:${MB_TAG:-latest}
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB_NAME: cryptomarketbot_staging
      STREAM_TOKEN_SECRET: smoke-test-secret-0123456789abcdef0123456789abcdef
      STREAM_ALLOWED_ORIGINS: http://localhost:3000
      STREAM_PORT: 8787
      KRAKEN_WORKSPACE: cryptomarketbot
      SCRAPER_URL: http://scraper:8790
      HISTORY_URL: postgres://crypto_staging:smoke-crypto-history@history:5432/crypto_staging
      ENGINE_INSTANCE: smoke
      # The log files go to tmpfs here, never to the live stack's logs/ folder.
      LOG_DIR: /tmp/logs
    ports:
      - "127.0.0.1:18787:8787"
    volumes:
      - wallet:/data/kraken
    depends_on:
      mongo:
        condition: service_started
      wallet-copy:
        condition: service_completed_successfully

  stock-engine:
    <<: *engine
    image: marketbots-stock-engine:${MB_TAG:-latest}
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB_NAME: stockmarketbot_staging
      ALPACA_API_KEY: SMOKE-FAKE-KEY
      ALPACA_SECRET_KEY: SMOKE-FAKE-SECRET
      STREAM_TOKEN_SECRET: smoke-test-secret-0123456789abcdef0123456789abcdef
      STREAM_ALLOWED_ORIGINS: http://localhost:3000
      STREAM_PORT: 8788
      SCRAPER_URL: http://scraper:8790
      HISTORY_URL: postgres://stock_staging:smoke-stock-history@history:5432/stock_staging
      ENGINE_INSTANCE: smoke
      LOG_DIR: /tmp/logs
    ports:
      - "127.0.0.1:18788:8788"

  # Its own history store, in memory: the staging databases, never the live ones.
  history:
    image: timescale/timescaledb:2.31.0-pg17@sha256:b56a3f51991df1f79d0c1a0841cad5c5fa8058fdd6a3ee6886394a6d4c174538
    environment:
      POSTGRES_PASSWORD: smoke-history-superuser
      HISTORY_DATABASES: crypto_staging stock_staging
      CRYPTO_STAGING_PASSWORD: smoke-crypto-history
      STOCK_STAGING_PASSWORD: smoke-stock-history
      TS_TUNE_MEMORY: 1GB
      TS_TUNE_NUM_CPUS: 2
      TIMESCALEDB_TELEMETRY: "off"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./packages/history/docker/initdb.sh:/docker-entrypoint-initdb.d/10-history.sh:ro
    shm_size: 256m
    mem_limit: 1g

  scraper:
    image: marketbots-scraper:${MB_TAG:-latest}
    init: true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g

volumes:
  live-wallet:
    external: true
    name: cryptomarketbot_kraken-paper
  wallet:
